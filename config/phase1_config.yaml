phase: 1
task: "binary_classification"
description: "Normal vs Abnormal LUS — OpenPOCUS adult data"

data:
  manifest_path: "data/processed/phase1_manifest.csv"
  image_size: 224
  num_workers: 4

model:
  backbone: "mobilenet_v3_small"
  pretrained: true
  freeze_backbone: true
  num_classes: 2
  dropout: 0.3

training:
  batch_size: 32
  epochs: 20
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  optimizer: "adamw"
  scheduler: "reduce_on_plateau"
  scheduler_patience: 3
  scheduler_factor: 0.5
  early_stopping_patience: 5
  random_seed: 42

output:
  checkpoint_dir: "models/phase1/checkpoints"
  report_dir: "models/phase1/reports"
  figure_dir: "models/phase1/figures"
  history_dir: "models/phase1/history"

classes:
  0: "Normal"
  1: "Abnormal"
